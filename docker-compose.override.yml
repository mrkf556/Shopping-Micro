services:
  catalogdb:
    container_name: catalogdb
    restart: always
    ports:
         - "27017:27017"
    volumes:
         - "mongo_data:/data/db"
  #catalogapi
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - "DatabaseConnection__ConnectionString=mongodb://catalogdb:27017"
      - "DatabaseConnection__DatabaseName=CatalogDb"
      - "DatabaseConnection__CollectionName=Products"
      - "DatabaseConnection__BrandsCollection=Brands"
      - "DatabaseConnection__TypesCollection=Types"
      - "ElasticConfiguration__Uri=http://elasticsearch:9200" 
    depends_on:
       - catalogdb
    ports:
      - "9000:8080"
     
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro




 